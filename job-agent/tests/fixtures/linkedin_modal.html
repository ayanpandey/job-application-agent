<!doctype html><html><body>
<!-- One step of a LinkedIn Easy Apply modal, in LinkedIn's own markup:
     artdeco classes, generated ids, and every label tied on with for=. -->
<div class="artdeco-modal" role="dialog">
  <form>
    <label for="single-line-text-form-component-phoneNumber-4471">Mobile phone number</label>
    <input type="text" id="single-line-text-form-component-phoneNumber-4471" name="phoneNumber">

    <label for="single-line-text-form-component-8812">How many years of IT audit experience do you have?</label>
    <input type="number" id="single-line-text-form-component-8812" required>

    <label for="text-entity-list-form-component-3390">Are you legally authorized to work in India?</label>
    <select id="text-entity-list-form-component-3390" required>
      <option value="">Select an option</option>
      <option>Yes</option>
      <option>No</option>
    </select>

    <fieldset>
      <legend>Will you now or in the future require sponsorship?</legend>
      <label><input type="radio" name="sponsorship" value="Yes">Yes</label>
      <label><input type="radio" name="sponsorship" value="No">No</label>
    </fieldset>

    <label for="salary-9921">What are your salary expectations?</label>
    <input type="text" id="salary-9921" required>

    <input type="file" id="resume-upload" name="file">
  </form>
</div>
</body></html>
